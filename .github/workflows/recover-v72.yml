name: Recover Desktop Friends v0.0.1.9.72
on:
  push:
    paths:
      - .github/workflows/recover-v72.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-friends-v72-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified v0.0.1.9.71 installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.0.1.9.71 --repo "$GITHUB_REPOSITORY" --pattern "DesktopFriends_Setup_v0.0.1.9.71.exe"
          echo "bf507f4c05ce03f7c6cad88589ad65a3a1e17467e7c38ed6a37af2f38576723c  DesktopFriends_Setup_v0.0.1.9.71.exe" | sha256sum -c -
      - name: Rebuild missing animation assets and make v0.0.1.9.72 installer
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          cat > repair.py <<'PY'
          import zipfile, hashlib, io, json, pathlib
          from PIL import Image
          src=pathlib.Path('DesktopFriends_Setup_v0.0.1.9.71.exe')
          target=pathlib.Path('DesktopFriends_Setup_v0.0.1.9.72.exe')
          with zipfile.ZipFile(src) as old:
              infos=old.infolist()
              names=set(old.namelist())
              stub_length=min(info.header_offset for info in infos)
              assert stub_length>1000000 and old.testzip() is None
              assert b'0.0.1.9.71' in old.read('version.json')
              img=Image.open(io.BytesIO(old.read('assets/nerd_idle.png'))).convert('RGBA')
              bbox=img.getchannel('A').getbbox()
              sprite=img.crop(bbox)
              extra={}
              for i,y in enumerate([7,4,2,7]):
                  frame=Image.new('RGBA',(64,64),(0,0,0,0))
                  frame.alpha_composite(sprite,((64-sprite.width)//2,y))
                  buf=io.BytesIO(); frame.save(buf,'PNG',optimize=True)
                  extra[f'assets/nerd_jump_{i:02d}.png']=buf.getvalue()
              for i in range(4):
                  for kind,srcname in [('idle','idle'),('eat','eat'),('blink','idle')]:
                      extra[f'assets/nerd_{kind}_{i:02d}.png']=old.read(f'assets/nerd_{srcname}.png')
              script=old.read('Native_DesktopFriends.ps1').decode('utf-8-sig')
              assert script.count("$script:AppVersion = '0.0.1.9.71'")==1
              script=script.replace("$script:AppVersion = '0.0.1.9.71'","$script:AppVersion = '0.0.1.9.72'",1)
              original='            if (!(Test-Path -LiteralPath $file)) {throw "Missing character asset: $file (requested: $key)"}'
              assert script.count(original)==1
              fix='''            if (!(Test-Path -LiteralPath $file)) {
                              Log ("Missing character asset: $file (requested: $key); selecting fallback pose")
                              $fallbackFile=Join-Path $script:AppRoot ('assets\\' + $character + '_idle.png')
                              if (!(Test-Path -LiteralPath $fallbackFile)) {
                                  $fallbackFile=Join-Path $script:AppRoot ('assets\\' + $character + '_idle_00.png')
                              }
                              if (!(Test-Path -LiteralPath $fallbackFile)) {throw "Missing character asset and fallback: $file (requested: $key)"}
                              $file=$fallbackFile
                          }'''
              script=script.replace(original,fix,1)
              changes={'Native_DesktopFriends.ps1':script.encode('utf-8-sig')}
              v=json.loads(old.read('version.json').decode('utf-8-sig'))
              v['version']='0.0.1.9.72'
              v['changes']=['안진이 누락 모션 프레임 및 앱 실행 종료 오류 수정','모션 에셋 누락 시 기본 자세 대체','SQL 변경 없음']
              changes['version.json']=(json.dumps(v,ensure_ascii=False,indent=2)+'\n').encode()
              if 'Make_Friends_Package.ps1' in names:
                  changes['Make_Friends_Package.ps1']=old.read('Make_Friends_Package.ps1').replace(b'0.0.1.9.71',b'0.0.1.9.72')
              with open(src,'rb') as f: stub=f.read(stub_length)
              assert stub.startswith(b'MZ')
              target.write_bytes(stub)
              with zipfile.ZipFile(target,'a',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as new:
                  for info in infos:
                      data=changes.pop(info.filename, None)
                      if data is None: data=old.read(info.filename)
                      new.writestr(info,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=6)
                  assert not changes
                  for name,data in sorted(extra.items()):
                      assert name not in names
                      new.writestr(name,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=6)
          with zipfile.ZipFile(target) as check:
              assert check.testzip() is None
              assert len(check.namelist())==len(infos)+len(extra)==1672
              assert json.loads(check.read('version.json'))['version']=='0.0.1.9.72'
              for kind,count in [('jump',4),('idle',4),('blink',4),('eat',4),('wave',8),('stretch',6),('yawn',8)]:
                  for i in range(count):assert f'assets/nerd_{kind}_{i:02d}.png' in check.namelist()
          sha=hashlib.sha256(target.read_bytes()).hexdigest()
          pathlib.Path('manifest.json').write_text(json.dumps({'version':'0.0.1.9.72','file':target.name,'sha256':sha},indent=2)+'\n')
          print('Verified',target.name,'SHA-256',sha)
          PY
          python3 repair.py
      - name: Publish to GitHub Releases for existing automatic updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.0.1.9.72 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.0.1.9.72 already exists; refusing to overwrite release artifacts."
            exit 0
          fi
          gh release create v0.0.1.9.72 \
            DesktopFriends_Setup_v0.0.1.9.72.exe manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Desktop Friends v0.0.1.9.72" \
            --notes "Emergency repair: missing Anjini animation frames and fallback handling. No database changes." \
            --latest
